    <style>
      /* Critical CSS for loading screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0a0f;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-ring {
        width: 64px;
        height: 64px;
        border: 3px solid rgba(0, 245, 255, 0.1);
        border-top-color: #00F5FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-text {
        margin-top: 20px;
        color: #00F5FF;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
    </style>
